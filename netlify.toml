[build]
  command = "pnpm build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.4.1"

# O aplicativo usa roteamento SPA no cliente. O arquivo _redirects em
# client/public também é copiado para dist/public durante o build.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
